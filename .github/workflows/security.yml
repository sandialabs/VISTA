name: SBOM and Vulnerability Scan

on:
  push:
    branches: [ main, vista-tk ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write # Needed to upload SARIF results to GitHub Security tab

jobs:
  syft-and-grype:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: "."
          format: "spdx-json"
          output-file: "sbom.spdx.json"

      - name: Scan SBOM for vulnerabilities with Grype
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: "sbom.spdx.json"
          fail-build: true
          severity-cutoff: "high"

      - name: Upload Grype SARIF report to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

