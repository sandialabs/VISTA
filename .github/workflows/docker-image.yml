name: CI/CD Pipeline

# Define variables at the top
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sandialabs/vista
  PYTHON_VERSION: "3.14"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Nightly Playwright run only; see the "Run critical end-to-end
    # workflows" step below, which is gated on this trigger.
    - cron: "17 7 * * *"

permissions:
  contents: read
  checks: write
  security-events: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: vista_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Set up Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev which
    
    - name: Build frontend
      run: |
        cd frontend
        npm ci --legacy-peer-deps
        npm run build
    
    - name: Install uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

    - name: Install Python dependencies with uv
      run: uv sync --frozen

    - name: Lint and type-check backend
      run: |
        uv run ruff check backend/services backend/repositories backend/schemas backend/utils/metadata_values.py backend/metadata
        uv run ruff format --check backend/services backend/repositories backend/schemas backend/utils/metadata_values.py backend/metadata
        uv run mypy

    - name: Set up test environment
      run: |
        cp .env.example backend/.env || echo "No .env.example found, using defaults"

    - name: Run tests
      run: uv run bash test/run_tests.sh
      env:
        DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vista_test
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: vista_test
        POSTGRES_SERVER: localhost
        POSTGRES_PORT: 5432
        DEBUG: true
        SKIP_HEADER_CHECK: true
        MOCK_USER_EMAIL: test@example.com
        JUNIT_XML_PATH: ${{ github.workspace }}/test-results/backend.xml

    - name: Verify PostgreSQL migration upgrade path
      working-directory: backend
      run: |
        ../.venv/bin/alembic upgrade 20260428_0008
        ../.venv/bin/alembic upgrade head
      env:
        DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vista_test
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: vista_test
        POSTGRES_SERVER: localhost
        POSTGRES_PORT: 5432

    - name: Run PostgreSQL integration contracts serially
      working-directory: backend
      run: ../.venv/bin/python -m pytest -q -m postgres tests/postgres
      env:
        VISTA_POSTGRES_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vista_test
        DEBUG: false
        SKIP_HEADER_CHECK: false
        PROXY_SHARED_SECRET: postgres-ci-proxy-secret
        MOCK_USER_EMAIL: test@example.com

    - name: Install Chromium for critical end-to-end tests
      if: github.event_name == 'schedule'
      working-directory: frontend
      run: npx playwright install --with-deps chromium

    - name: Run critical end-to-end workflows serially
      if: github.event_name == 'schedule'
      working-directory: frontend
      run: >-
        npm run test:e2e --
        e2e/specs/full-inspection-workflow.spec.js
        e2e/specs/inspection-workbench.spec.js
        e2e/specs/pt3-fullscreen-annotation-parity.spec.js
        --project=chromium-local
        --workers=1
        --retries=0

    - name: Publish test results
      uses: dorny/test-reporter@31a54ee7ebcacc03a09ea97a7e5465a47b84aea5 # v1.9.1
      if: success() || failure()
      with:
        name: Backend Test Results
        path: test-results/backend.xml
        reporter: java-junit

  build:
    needs: test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

    - name: Compute the weekly OS refresh key
      # Passed as OS_REFRESH to every image build below (one value, so the push reuses the
      # test build's cache). It re-runs the Dockerfile's rootfs install once a week, so base
      # package fixes land even though every other layer comes from the GHA cache.
      id: refresh
      run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
    
    - name: Log in to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build test image
      # The test stage is the production image plus uv; it is never pushed.
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
      with:
        context: .
        target: test
        load: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test
        build-args: |
          OS_REFRESH=${{ steps.refresh.outputs.week }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test container
      run: |
        # Start the container (install dev deps for aiosqlite SQLite driver).
        # --inexact --no-install-package keeps the image's FFmpeg-free OpenCV; a plain
        # "uv sync --frozen" would replace it with the PyPI wheel that bundles FFmpeg.
        docker run -d --name test-container \
          -e DATABASE_URL="sqlite+aiosqlite:///./test.db" \
          -e FAST_TEST_MODE=true \
          -e DEBUG=true \
          -e SKIP_HEADER_CHECK=true \
          -e VISTA_AUTH_BACKEND=demo \
          -e POSTGRES_USER=postgres \
          -e POSTGRES_PASSWORD=postgres \
          -e POSTGRES_DB=postgres \
          -e POSTGRES_SERVER=localhost \
          -p 8000:8000 \
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test \
          bash -c "uv sync --frozen --inexact --no-install-package opencv-python-headless && uvicorn main:app --host 0.0.0.0 --port 8000"
        
        # Wait for container to start and implement health checking with retry
        echo "Waiting for container to become healthy..."
        for i in {1..30}; do
          if curl -f http://localhost:8000/api/health > /dev/null 2>&1; then
            echo "Container is healthy after ${i} attempts"
            break
          fi
          if [ $i -eq 30 ]; then
            echo "Container failed to become healthy after 30 attempts"
            docker logs test-container
            exit 1
          fi
          echo "Attempt $i failed, waiting 2 seconds..."
          sleep 2
        done
        
        # Test health endpoint one more time to be sure
        curl -f http://localhost:8000/api/health || exit 1
        
        # Stop container
        docker stop test-container
        docker rm test-container

    - name: Run tests in container
      run: |
        # The image leaves the test suites out (.dockerignore), and many tests read other
        # repository files, so mount the checkout and run its tests with the image's Python
        # and venv. --inexact --no-install-package keeps the FFmpeg-free OpenCV.
        docker run --rm \
          -e DATABASE_URL="sqlite+aiosqlite:///./test.db" \
          -e FAST_TEST_MODE=true \
          -e DEBUG=true \
          -e SKIP_HEADER_CHECK=true \
          -e VISTA_AUTH_BACKEND=demo \
          -e POSTGRES_USER=postgres \
          -e POSTGRES_PASSWORD=postgres \
          -e POSTGRES_DB=postgres \
          -e POSTGRES_SERVER=localhost \
          -v "$PWD:/workspace" \
          --workdir /workspace \
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test \
          bash -c "uv sync --frozen --inexact --no-install-package opencv-python-headless && bash test/run_tests.sh --backend"

    - name: Push Docker image
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
      with:
        context: .
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        build-args: |
          OS_REFRESH=${{ steps.refresh.outputs.week }}
        cache-from: type=gha

        cache-to: type=gha,mode=max

